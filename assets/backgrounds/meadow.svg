<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <title>Çayır arka planı</title>
  <desc>Gökyüzü, bulutlar, tepeler ve ağaçlardan oluşan sade çayır manzarası. Ana ekran ve oyun ekranları için.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD8FF"/>
      <stop offset="1" stop-color="#E6F6FF"/>
    </linearGradient>
    <g id="cloud" fill="#FFFFFF">
      <ellipse cx="0" cy="0" rx="70" ry="34"/>
      <ellipse cx="-56" cy="14" rx="46" ry="26"/>
      <ellipse cx="58" cy="14" rx="50" ry="26"/>
    </g>
    <g id="tree">
      <rect x="-12" y="-10" width="24" height="70" rx="10" fill="#B9825A"/>
      <circle cx="0" cy="-40" r="56" fill="#5CC25C"/>
      <circle cx="22" cy="-30" r="40" fill="#4BAF4F"/>
      <circle cx="-22" cy="-62" r="18" fill="#FFFFFF" opacity="0.25"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1380" cy="140" r="70" fill="#FFE27A"/>
  <circle cx="1380" cy="140" r="96" fill="#FFE27A" opacity="0.3"/>
  <use href="#cloud" transform="translate(260 140)"/>
  <use href="#cloud" transform="translate(900 100) scale(0.8)"/>
  <use href="#cloud" transform="translate(1180 260) scale(0.6)"/>
  <path d="M0 560 C200 420 420 420 640 540 C860 440 1120 400 1600 520 V900 H0 Z" fill="#B5E8A0"/>
  <path d="M0 660 C260 580 520 600 800 660 C1080 600 1340 580 1600 640 V900 H0 Z" fill="#8FD86E"/>
  <rect y="760" width="1600" height="140" fill="#7CCB5C"/>
  <use href="#tree" transform="translate(140 640)"/>
  <use href="#tree" transform="translate(1470 620) scale(1.1)"/>
  <use href="#tree" transform="translate(1290 680) scale(0.7)"/>
  <g fill="#FF8FB7"><circle cx="420" cy="800" r="8"/><circle cx="980" cy="830" r="8"/><circle cx="1180" cy="790" r="8"/></g>
  <g fill="#FFD24D"><circle cx="520" cy="840" r="7"/><circle cx="760" cy="800" r="7"/><circle cx="1400" cy="840" r="7"/></g>
</svg>
